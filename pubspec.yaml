name: delitopia_v2
description: "Enhanced Delitopia food ordering app with beautiful UI"
publish_to: 'none'

version: 2.1.8+31

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  
  # UI & Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  card_swiper: ^3.0.1
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0
  
  # Navigation
  go_router: ^14.2.8
  
  # Utilities
  intl: ^0.20.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.1
  
  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  
  # QR & Scanning
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  timeline_tile: ^2.0.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  
  # Google Sign In
  google_sign_in: ^6.2.2
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  
  # Forms & Validation
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.0.0
  
  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  logger: ^2.4.0
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  sign_in_with_apple: ^8.2.0
  gal: ^2.3.3
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.4
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logoApp.png"
  adaptive_icon_background: "#EA1C24"
  adaptive_icon_foreground: "assets/images/logoApp.png"
  min_sdk_android: 21 

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/category/
    - assets/images/payment/
    - assets/animations/
    - assets/icons/
    - assets/schema/
    - assets/sounds/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Bold.ttf
          weight: 700
